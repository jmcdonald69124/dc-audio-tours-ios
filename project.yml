# XcodeGen spec — generate the Xcode project with:  xcodegen generate
# (brew install xcodegen). The .xcodeproj is not committed; this file is the source of truth.
name: DCAudioTours

options:
  bundleIdPrefix: com.fettink
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Set your Apple Developer team once: either here or in Xcode ▸ Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The app target stays in Swift 5 language mode while it is young; TourKit is Swift 6.
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  TourKit:
    path: Packages/TourKit

targets:
  DCAudioTours:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/DCAudioTours
        excludes:
          - "Resources/Content/**"
      # Bundled catalog + per-language content, kept as a folder reference so the
      # directory structure survives in the bundle (Content/catalog.json, Content/content/en.json…).
      - path: App/DCAudioTours/Resources/Content
        type: folder
        buildPhase: resources
    dependencies:
      - package: TourKit
    info:
      path: App/DCAudioTours/Info.plist
      properties:
        CFBundleDisplayName: DC Audio Tours
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, fr, de, ja, ko, zh-Hans, pt-BR]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Narration keeps playing with the screen locked or the app in the background.
        UIBackgroundModes:
          - audio
        # Playfair Display (SIL OFL) — the web app's serif.
        UIAppFonts:
          - PlayfairDisplay-Medium.ttf
          - PlayfairDisplay-SemiBold.ttf
          - PlayfairDisplay-Italic.ttf
          - PlayfairDisplay-MediumItalic.ttf
        NSLocationWhenInUseUsageDescription: "DC Audio Tours shows where you are on the walk and tells you when you reach the next stop."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Allow location in the background so your phone can tell you when you arrive at the next stop, even with the screen off."
        ITSAppUsesNonExemptEncryption: false
        # Where narration audio is streamed from. Free stops need no token.
        AudioBaseURL: "https://dcaudiotours.com"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fettink.dcaudiotours
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

schemes:
  DCAudioTours:
    build:
      targets:
        DCAudioTours: all
    run:
      config: Debug
    archive:
      config: Release
